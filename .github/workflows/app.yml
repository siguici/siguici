name: App

on:
  push:
    branches:
      - main

    paths:
      - .github/workflows/*
      - app/**

jobs:
  build:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ubuntu-latest]

    name: 📦️ Building @siguici's assets on ${{ matrix.operating-system }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: 🔧 Setup JS
        uses: siguici/setup-js@v1
        with:
          scripts: build
          cwd: ./app

      - name: 🚚 Upload distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: app/out

  deploy:
    needs: build

    runs-on: ${{ matrix.operating-system }}

    environment:
      name: production
      url: https://siguici.deno.dev

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        operating-system: [ubuntu-latest]

    name: 🚀 Deploy @siguici app on ${{ matrix.operating-system }}

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: 🚚 Download distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: app/out

      - name: 🗃️ List distribution files
        run: ls -R app/out

      - name: 🔨 Configure Deno
        uses: siguici/setup-js@v1
        with:
          scripts: check,build
          cwd: ./app

      - name: 📂 Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: siguici
          entrypoint: out/server/entry.mjs
          root: app
